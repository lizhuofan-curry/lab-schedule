grill_decision_packet:
  goal: HenuBCI任务协作及成员近期工作展示
  problem_layer: 实验室任务协作与成员近期工作可见性的业务规则和权限边界
  target_user_or_maintainer: 注册实验室成员、游客和项目维护者
  stakeholders_and_owners:
  - 发布者负责自己任务的要求、执行对象、验收、撤销和重新开启
  - 执行成员负责对应成果；组长继续仅按现有权限维护小组
  - 注册成员负责本人个人工作记录的填写、增删改和状态更新
  - 项目维护者负责发布、容量、备份、恢复和后续维护
  scope:
  - 公告与指定任务；个人、多人、多组混选；人数上限或不限人数
  - 动态小组执行名单；共同或逐人交付；文字、链接和10MB以内附件
  - 要求变更、成果版本、打回、验收、撤销和多轮重新开启
  - 站内消息及进入网站后的未读指派弹窗
  - 游客仅查看任务列表的标题、发布者、截止时间和状态
  - 现有成员页面保留课表，加入本人文字工作记录和承担的近期任务
  - 个人记录为标题说明和进行中已完成暂停状态，仅本人可增删改
  - 他人查看进行中暂停及近7天完成记录；本人完整管理全部自己的记录
  - 任务展示进行中及滚动7天内完成；个人记录确认删除后无恢复入口
  non_goals:
  - 全站管理员、他人任务管理、游客写入或详情成果附件访问
  - 邮件微信通知、自动截止提醒、实时推送和代码平台自动读取
  - 任务自动排期、评论聊天、子任务和课表既有后续增量
  - 独立会议纪要、个人记录附件评论额外提醒回收站以及会后录入人员的特殊权限
  locked_decisions:
    task_publish_authority: 所有注册成员
    task_cancel_authority: 仅任务发布者
    task_assignee_model: 公告自行领取；指定任务支持个人多人及多个小组
    task_completion_unit: 发布时选择共同交付或逐人交付
    task_completion_gate: 发布者验收通过；允许打回
    task_visibility: 所有注册成员可查看任务及成果
    guest_task_read_scope: 仅任务列表，不允许详情成果附件消息及写操作
    announcement_claim_limit: 可设置人数上限或不限人数
    announcement_claim_withdrawal: 领取后只能由发布者移出
    direct_assignment_acceptance: 指派直接生效，无需接受
    assignment_target_composition: 个人与多个小组可混选，按成员去重
    group_assignee_membership: 进行中任务跟随当前小组成员变化
    group_task_manual_override: 不单独覆盖组员，组内变化由有权限的组长处理
    completed_task_membership_change: 已完成轮次固定名单
    submission_channels: 文字链接和文件；PDF文本Markdown图片Office及CSV
    attachment_file_size_limit: 10MiB（10485760字节）
    task_deadline_policy: 可选，逾期仍可提交
    submission_revision_policy: 通过前可随时重提，保留历史
    announcement_completion_boundary: 发布者先结束领取，再满足全部成果完成条件
    shared_submission_authority: 任意当前执行成员可提交共享成果
    task_notification_scope: 站内消息及进入网站时的指派弹窗
    assignment_popup_acknowledgement: 知道了或查看对应任务后标记已读
    published_task_content_editing: 进行中可改标题说明截止时间附件，保留记录并通知
    terminal_task_reopening: 已完成及已撤销均可由发布者重开
    reopened_task_submission_validity: 旧成果仅保留历史，新轮重新提交与验收
    reopened_announcement_claiming: 发布者选择是否恢复领取，原成员默认保留
    meeting_content: 沿用原规则，由发布者直接发布任务
    member_work_source: 本人填写工作记录，加上系统中的任务情况
    meeting_editor_authority: 沿用原任务权限，不为两位会后录入人员赋予特殊角色
    work_record_progress: 多条记录，每条为标题说明及进行中已完成暂停状态
    member_task_scope: 该成员承担的进行中任务及近7天完成任务
    member_work_visibility: 仅注册成员可查看个人记录，游客及未登录者不能读取
    personal_work_scope: 对他人展示进行中暂停及近7天完成记录
    recent_week_definition: 查询时刻向前7乘24小时的滚动窗口，不按自然周重置
    personal_work_deletion: 本人确认后删除，无回收站和产品恢复入口
    owner_history_management: 本人可查看增删改全部自己的记录，其他成员只有近期查看范围
    increment_scope_confirmation: 沿用原成员页面保留课表，不增加会议纪要记录附件评论额外提醒
    guest_task_fields: id/title/publisher/deadline/status/kind；其余详情禁止
  tradeoffs_accepted:
  - 指派直接生效但不增加全站管理员，所有权按任务限制
  - 全体注册成员共享成果可见性，游客只获得列表
  - 小组动态变化带来责任变动，历史轮次固定且目标来源必须去重
  - 重提及重开保留历史，需承担存储和一致性维护成本
  - 本人承担手动更新个人工作内容和状态的成本，系统不自动推断个人工作
  - 接受本人可管理全部旧记录而他人只查看近期范围；确认删除后无产品恢复入口
  primary_invariant: 服务端会话决定操作人；仅发布者管理验收自己的任务，仅当前执行成员提交；个人记录仅本人写，他人仅看近期；游客任务访问限列表且禁止个人记录
  success_criteria:
  - 公告与混选指定任务均可完成发布提交打回重提验收闭环
  - 多组名单变化、停止领取及新轮任务完成条件一致
  - 越权、游客详情附件访问、并发重复写入和旧版误验收均被拒绝
  - 手机桌面流程、提醒已读及附件恢复通过
  - 个人记录本人增改删、他人近期读取、本人完整管理及游客越权拒绝均通过
  - 滚动7天临界点状态往返与文字修改不重置完成时间通过，成员页面保留课表且390px可用
  proof_bar: 09-PRD-v2.md的V2-01～17、V2-W01～10；实际结果统一见07-TASKS.md
  compatibility_posture: 保留现有课表账号小组课程及任务权限，不新增特殊角色；游客不获得个人记录权限，当前生产不因文档改变
  rollout_rollback_posture: v2已上线；后续发布先成套备份并验收，应用回退保留任务、文件、记录和卷
  support_and_maintenance_posture: 沿用现有维护者、目录、错误提示、备份恢复；状态见07
  researched_facts:
  - 现有会话所有权、任务/小组事务锁、版本校验和私有文件契约见02/03
  - v2及工作已上线，当前验证/修复证据见07-TASKS
  default_assumptions:
  - assumption: 最终收口轮提出的每次5个附件、打回原因必填、移出成果保留、空名单不完成等规则沿用
    provenance: user_locked
    confidence: high
    verification_plan: 按PRD第10节验收；最终修改仅涉及游客列表
    consequence_if_wrong: 需调整附件限制和完成验收规则
  - assumption: 具体文件扩展名和10MB字节口径按PRD第5及第11节
    provenance: model_default
    confidence: medium
    verification_plan: 实现前核验允许类型与服务端校验，边界大小及伪造类型测试
    consequence_if_wrong: 个别格式可能无法上传，需修订允许类型或用链接
  - assumption: 发布后类型和交付模式固定，要求修改不自动撤回通过结果，完成任务不直接改为撤销
    provenance: model_default
    confidence: medium
    verification_plan: 状态与页面契约评审核验，变化时先更新验收及历史映射规则
    consequence_if_wrong: 需增加模式转换或撤回验收规则，不可悄悄重解释历史成果
  - assumption: 弹窗逐项已读、失效指派过滤及原截止时间沿用按PRD补充规则
    provenance: model_default
    confidence: high
    verification_plan: 提醒及重新开启的真实浏览器验收
    consequence_if_wrong: 会出现重复提醒或新轮截止时间误解
  - assumption: 个人记录默认进行中，标题说明必填且沿用120字与20000字的现有文字边界
    provenance: artifact_inferred
    confidence: medium
    verification_plan: 页面与服务端统一输入校验和长度边界测试
    consequence_if_wrong: 需调整个人记录字段提示及校验边界，不影响所有权规则
  - assumption: 完成时间由状态切换确定，完成状态内修改文字不重置；恢复进行中或暂停后再次完成使用新完成时间
    provenance: model_default
    confidence: high
    verification_plan: V2-W05及V2-W06覆盖状态往返跨周临界点和旧记录改字
    consequence_if_wrong: 需另行确认完成历史语义，否则旧记录可能误入近期
  - assumption: 成员任务摘要采用当前轮次与有效名单，完成轮次名单固定，旧轮历史仍通过任务详情访问
    provenance: artifact_inferred
    confidence: medium
    verification_plan: V2-W07覆盖移出入组完成和重开，回归原任务规则
    consequence_if_wrong: 若需逐轮参与历史，应补充成员页面历史范围，不能自动扩展
  - assumption: 个人记录按更新时间倒序并分页，本人完整管理与他人近期读取分别授权
    provenance: model_default
    confidence: medium
    verification_plan: V2-W03及V2-W09核验分页不遗漏重复和旧记录读权限
    consequence_if_wrong: 需调整排序或分页，不改变完成时间和访问范围
  - assumption: 沿用现有维护者技术栈发布和回退要求，不承诺本轮开发或部署日期
    provenance: artifact_inferred
    confidence: high
    verification_plan: 开发交接及发布前核对容量性能备份恢复与状态记录
    consequence_if_wrong: 需重新确认维护者及发布责任，不可据文档视为已上线
  open_questions: []
  deferred_questions: []
  immaterial_questions:
  - 不另询问现有技术栈及小组管理规则，已从文档代码核验
  - 不在业务需求阶段固定页面路由和物理文件存放路径，相关契约已明确负责人及核定触发点
  lane_status:
    problem_layer: answered
    users_stakeholders_owners: assumed
    scope: answered
    non_goals: answered
    success_criteria: answered
    constraints: deferred
    dependencies_prerequisites: researched
    interfaces_data_integrations: researched
    security_policy_compliance: answered
    tradeoffs_priorities: answered
    edge_cases_failure_modes: assumed
    rollout_migration_compatibility: researched
    verification_observability_acceptance: answered
    maintenance_support: assumed
  plan_allowed: true
