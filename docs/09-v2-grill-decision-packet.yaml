    goal: 清理本人已读消息，减少站内消息列表负担
    problem_layer: 通知历史整理及明确删除范围
    target_user_or_maintainer: 注册成员和项目维护者
    stakeholders_and_owners:
    - 成员决定删除自己的已读消息
    - 开发者负责实现及验证；维护者负责备份发布和回退
    scope:
    - 原消息页多选删除及一键删除已加载的已读消息
