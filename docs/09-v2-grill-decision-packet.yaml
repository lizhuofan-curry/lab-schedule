      modes: 多选删除与一键删除已加载已读
      retention: 确认后删除，无回收站或恢复入口
      business_isolation: 删除通知不删除任务成果反馈轮次附件或任务历史
    tradeoffs_accepted:
    - 只能清理已加载范围，清理更早消息需先加载
    - 无恢复入口，换取简单的整理流程
    primary_invariant: 会话决定接收人，删除仅作用于本人已读通知，不影响未读提醒或业务事实
    success_criteria:
