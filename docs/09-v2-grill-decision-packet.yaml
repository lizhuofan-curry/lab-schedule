      graph_provider: 用户确认DeepSeek-V4.1-Flash，接口deepseek-flash；独立服务端凭据，计费以账号为准
      recommendation_provider: TypeSafe Jev；用户已有Key，尚未配置或真实验证
      candidate_scope: 默认全部注册启用成员，可限定小组；推荐个人和小组
      recommendation_priority: 综合相关经历与当前任务负担
      recommendation_entry: 发布指定任务及发布者调整进行中任务执行对象
      recommendation_trigger: 发布者点击推荐候选人
      recommendation_result: 排序和相关经历负担依据，信息不足明示但仍可手动选择
      assignment_authority: 发布者手选一人多人小组，不自动指派，实际提交再授权去重
      cost_policy: 不设费用上限，按实际调用付费，仍应控制无限重试并观察用量
    tradeoffs_accepted:
    - 扩大图谱历史读取，成员原写权限和成员页近期展示保持
    - 全量节点和自动AI更新接受阅读性能调优及调用成本
    - 当前组员历史汇总不能等同于本组在当时完成的成果
    - 接受模型判断可能有误，最终仍由发布者决定，不承诺未经验证准确率
    primary_invariant: 真实业务记录和服务端权限是事实来源；AI只做可追溯关联与建议，删除来源失效，不产生自动指派或扩大写权限
    success_criteria:
    - 2D图按范围正确展示全量历史，区分真实和推断，桌面手机可查来源
    - 自动更新和删除失效可验证，游客拒绝且原近期与本人写权限保持
    - 点击推荐个人及小组，范围负担依据可信，发布者手选且重新校验当前资格
    - 模型失败不阻断基础图或手动指派，必要文本代号与凭据安全可验证
    proof_bar: 11-PRD-v3.md的V3-G01至G06、R01至R04、A01至A05；模型质量样本和性能门槛在开发准备时核定，未核定或未验证不作为上线通过
    compatibility_posture: V3专用读取扩展显式补契约，不改成员页近期窗口、课程算法、任务轮次、小组管理和写权限
    rollout_rollback_posture: 本轮仅文档；平台及数据契约确定后再开发，验证备份后单独发布；可停止AI，回退保留源数据并收回V3历史入口
    support_and_maintenance_posture: 沿用现有维护者、目录、错误提示、备份恢复；状态见07
    researched_facts:
    - 工作记录当前没有小组归属字段，其他成员的all历史请求被原服务拒绝
    - 现有任务支持个人多组混选、启用注册排除、动态名单和历史固定轮次
    - 现有Qwen配置只用于课表视觉识别，不能证明已配置图谱文字模型
    - Jev官方文档支持Choice、Score、Noul结构化结果，不生成自由文本
    - 官方参考为https://docs.typesafe.ai/introduction和https://api.typesafe.ai/docs
    - 本轮未调用付费模型或验证Key，不声称性能或推荐准确率
    default_assumptions:
    - assumption: 所有图谱来源保留类型所有者和状态以可核实，但不另分个人经历与小组成果区域
      provenance: artifact_inferred
      confidence: high
      verification_plan: V3-G01、G03检查真实来源归属和当前小组历史汇总
      consequence_if_wrong: 展示结构需调整，不能误标业务事实
    - assumption: 自动更新可合并变化缓存重试，但旧版本和已删除来源不能重新发布
      provenance: model_default
