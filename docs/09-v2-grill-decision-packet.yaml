      provenance: model_default
      confidence: medium
      verification_plan: V22-N04至N06验证服务端授权及不发生部分删除
      consequence_if_wrong: 错误或重试语义需调整，不能放宽本人已读边界
    - assumption: 继续沿用中文主题、居中确认和390px移动适配
      provenance: artifact_inferred
      confidence: high
      verification_plan: V22-N08桌面手机和键盘验证
