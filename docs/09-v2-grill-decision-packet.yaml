      confidence: high
      verification_plan: 实现前审核数据流，V3-A02与A05验证失败隔离和资源边界
      consequence_if_wrong: 需重新评估部署资源及业务可用性，不静默扩大费用或服务
    - assumption: 分析不编造能力，无依据者明确缺失信息，推荐理由来自可核实事实摘要
      provenance: model_default
      confidence: high
      verification_plan: V3-R02、A04人工核对经历负担及信息不足案例
      consequence_if_wrong: 建议可能误导成员选择，需要调整评分和展示
