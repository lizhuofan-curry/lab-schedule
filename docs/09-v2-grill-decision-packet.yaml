    - 授权、并发重复、分页与桌面手机交互可验证
    proof_bar: 10-PRD-v2.2.md的V22-N01～09；本地68单元/74集成/32浏览器通过，正式结果见07
    compatibility_posture: 保留现有消息读取已读分页指派弹窗及全部课程任务权限
    rollout_rollback_posture: 已授权开发部署；先备份及回退保护，应用回退不恢复用户明确删除的消息
    support_and_maintenance_posture: 沿用现有维护者、目录、错误提示、备份恢复；状态见07
    researched_facts:
    - 原读取每批200条、ID游标；新增DELETE固定集合1～10000条，契约见03
    - 本地验证及生产状态见07，不复用旧版本上线证据
    default_assumptions:
